name: Publish Release

# Mirrors a finished, signed build from the PRIVATE build repo to the PUBLIC
# releases repo that customers and the auto-updater actually read.
#
# ⚠️ THIS FILE IS A COPY. The live workflow is
# CipherPlayLabs/Auto-Grow-releases/.github/workflows/publish-release.yml.
# This committed version drifted from the live one before (the live one had
# gained *.zip and *.AppImage patterns that were never copied back), which is
# how a reviewer reading this repo got a wrong picture of what ships. If you
# change one, change both in the same sitting.
#
# Triggered from the private repo's publish-release.sh (`npm run release:publish`)
# or manually from the GitHub UI.
#
# Setup (one time):
#   1. Copy this file to Auto-Grow-releases/.github/workflows/publish-release.yml
#   2. Create a PAT with "contents:read" on CipherPlayLabs/AutoGrow (private repo)
#   3. Go to Auto-Grow-releases → Settings → Secrets → Actions
#   4. Add secret: PRIVATE_REPO_TOKEN = your PAT

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.3)"
        required: true

permissions:
  contents: write
  # Artifact attestations are signed with a short-lived Sigstore certificate
  # minted against this job's OIDC identity. THIS repo is public, which is why
  # they work here — on the private build repo GitHub gates them behind
  # Enterprise Cloud, and the build workflow only warns.
  id-token: write
  attestations: write

env:
  PRIVATE_REPO: CipherPlayLabs/AutoGrow

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Diagnose token access
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          echo "=== Token identity ==="
          gh api user --jq '"Authenticated as: \(.login)"' || echo "Token is invalid or has no user scope"

          echo ""
          echo "=== Can token see the repo? ==="
          gh api "repos/$PRIVATE_REPO" --jq '"Repo: \(.full_name)\nPrivate: \(.private)\nPermissions: \(.permissions)"' || echo "Cannot see $PRIVATE_REPO — check PAT scope/SSO/fine-grained access"

          echo ""
          echo "=== Release check ==="
          TAG="${{ github.event.inputs.tag }}"
          gh release view "$TAG" --repo "$PRIVATE_REPO" --json tagName,assets \
            --jq '"Tag: \(.tagName)\nAssets: \(.assets | length)\n" + (.assets | map("  - \(.name) (\(.size) bytes)") | join("\n"))'

      - name: Download artifacts from private release
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          mkdir -p assets
          gh release download "$TAG" \
            --repo "$PRIVATE_REPO" \
            --dir assets \
            --pattern "*.exe" \
            --pattern "*.dmg" \
            --pattern "*.zip" \
            --pattern "*.deb" \
            --pattern "*.AppImage" \
            --pattern "*.yml" \
            --pattern "*.yaml" \
            --pattern "*.blockmap" \
            --pattern "SHA256SUMS.txt"

          FILE_COUNT=$(find assets -type f | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: No artifacts downloaded for $TAG"
            exit 1
          fi
          echo "Downloaded $FILE_COUNT file(s):"
          ls -lh assets/

      # ── The mirror proves it copied faithfully ────────────────
      # This is what makes attesting in THIS repo an honest claim. The build
      # happened in the private repo; all this workflow does is move bytes. By
      # re-deriving every hash against the manifest the build itself published,
      # we establish that the files signed-for below are byte-identical to the
      # ones that were code-signed and notarized upstream. Without this step the
      # attestation would only say "some file passed through our publish job".
      #
      # Hard failure on purpose: a mismatch means the artifact on the public
      # release differs from the artifact that was signed.
      - name: Verify artifacts match the upstream build manifest
        working-directory: assets
        run: |
          set -euo pipefail

          if [ ! -f SHA256SUMS.txt ]; then
            echo "::error::SHA256SUMS.txt is missing from the upstream release ${{ github.event.inputs.tag }}."
            echo "::error::Builds before v1.0.217 predate that manifest and cannot be mirrored by this workflow."
            exit 1
          fi

          echo "══ upstream manifest ══"
          cat SHA256SUMS.txt

          echo ""
          echo "══ re-derived from the downloaded bytes ══"
          # -c fails on any mismatch AND on any listed file that did not arrive,
          # so this covers a truncated download as well as a corrupted one.
          sha256sum -c SHA256SUMS.txt

          echo ""
          echo "══ every shipped binary is covered by the manifest ══"
          # The reverse direction: -c proves everything LISTED is intact, not
          # that everything PRESENT is listed. An unlisted binary would sail
          # through the check above and still land on the public release.
          shopt -s nullglob
          uncovered=0
          for file in *.exe *.dmg *.zip *.deb *.AppImage; do
            if grep -qF "  $file" SHA256SUMS.txt; then
              echo "  covered: $file"
            else
              echo "::error::$file is published but absent from SHA256SUMS.txt."
              uncovered=1
            fi
          done
          if [ "$uncovered" -ne 0 ]; then exit 1; fi

      # ── Signed provenance for what we are about to publish ────
      # Scope note, so nobody reads more into this than it says: the subject is
      # the bytes on the public release and the issuer is THIS publish workflow.
      # It does not claim to be the compiler. The chain a verifier can walk:
      #   Authenticode / Developer ID → CipherPlay signed these bytes (at build)
      #   the SHA256SUMS check above  → these bytes ARE the upstream build's output
      #   this attestation            → CipherPlayLabs' publish workflow put exactly
      #                                 these bytes on this release
      # Together that closes the "someone with release-write swapped a binary in"
      # gap, which signing alone does not.
      #
      # Attesting BEFORE the release is created means we never publish an
      # artifact we could not attest. Re-running is cheap and idempotent (the
      # release is deleted and recreated), so a hard failure costs a re-run,
      # never a rebuild.
      - name: Attest published artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            assets/*.exe
            assets/*.dmg
            assets/*.zip
            assets/*.deb
            assets/*.AppImage

      - name: Get release metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          TITLE=$(gh release view "$TAG" --repo "$PRIVATE_REPO" --json name -q .name 2>/dev/null || echo "AutoGrow $TAG")
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

          gh release view "$TAG" --repo "$PRIVATE_REPO" --json body -q .body > /tmp/release-notes.md 2>/dev/null || echo "Release $TAG" > /tmp/release-notes.md

      - name: Delete existing release (if re-publishing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" &>/dev/null; then
            echo "Release $TAG already exists — deleting to re-publish..."
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          fi

      - name: Create public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.meta.outputs.title }}" \
            --notes-file /tmp/release-notes.md \
            assets/*

          echo "Published: https://github.com/${{ github.repository }}/releases/tag/$TAG"

      - name: Summarize verification for this release
        run: |
          TAG="${{ github.event.inputs.tag }}"
          {
            echo "### Published \`$TAG\`"
            echo ""
            echo "Every binary was re-hashed against the upstream build's \`SHA256SUMS.txt\`"
            echo "and attested before publication."
            echo ""
            echo '```bash'
            echo "gh attestation verify <downloaded-file> --repo ${{ github.repository }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
